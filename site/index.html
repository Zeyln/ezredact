<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- No network access beyond loading the app's own files. Images never leave the device. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' blob:; manifest-src 'self'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#222222" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Image">
  <title>Image</title>
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="actions">
      <button id="openBtn" class="btn" type="button" title="Open image" aria-label="Open image">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 17l-5-5-9 8"/></svg>
        <span class="btn-label">Open</span>
      </button>
    </div>
    <div class="actions end">
      <button id="wipeBtn" class="btn" type="button" title="Close" aria-label="Close" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        <span class="btn-label">Close</span>
      </button>
      <button id="exportBtn" class="btn primary" type="button" title="Save" aria-label="Save" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V3M7 8l5-5 5 5M5 13v7h14v-7"/></svg>
        <span class="btn-label">Save</span>
      </button>
    </div>
  </header>

  <main id="stage" class="stage">
    <canvas id="canvas" hidden></canvas>

    <section id="empty" class="empty">
      <div class="empty-inner">
      <button id="emptyOpenBtn" class="btn large" type="button">Open image</button>
      </div>
    </section>

    <div id="dropOverlay" class="drop-overlay" hidden>Drop image</div>
  </main>

  <footer id="toolbar" class="toolbar" hidden>
    <div class="options">
      <div id="colorRow" class="row" role="radiogroup" aria-label="Fill color">
        <button class="swatch" type="button" role="radio" aria-checked="true" data-color="#000000" title="Black"><span class="chip black"></span></button>
        <button class="swatch" type="button" role="radio" aria-checked="false" data-color="#ffffff" title="White"><span class="chip white"></span></button>
      </div>
      <label id="sizeRow" class="row size" hidden>
        <span>Size</span>
        <input id="sizeInput" type="range" min="6" max="80" value="28">
      </label>
      <div class="history">
        <button id="undoBtn" class="icon-btn" type="button" title="Undo" aria-label="Undo" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 010 10h-3"/></svg>
        </button>
        <button id="redoBtn" class="icon-btn" type="button" title="Redo" aria-label="Redo" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 14l5-5-5-5"/><path d="M20 9H9a5 5 0 000 10h3"/></svg>
        </button>
        <button id="fitBtn" class="icon-btn" type="button" title="Fit to screen" aria-label="Fit to screen">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
        </button>
      </div>
    </div>
    <div class="tools" role="radiogroup" aria-label="Tool">
      <button class="tool" type="button" role="radio" aria-checked="true" data-tool="box" title="Box: solid cover, safest for text">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="8" width="18" height="8" rx="1" class="fill"/></svg>
        <span>Box</span>
      </button>
      <button class="tool" type="button" role="radio" aria-checked="false" data-tool="pixelate" title="Pixelate: for faces and photos, not text">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="6" height="6" class="fill"/><rect x="15" y="3" width="6" height="6" class="fill"/><rect x="9" y="9" width="6" height="6" class="fill"/><rect x="3" y="15" width="6" height="6" class="fill"/><rect x="15" y="15" width="6" height="6" class="fill"/></svg>
        <span>Pixelate</span>
      </button>
      <button class="tool" type="button" role="radio" aria-checked="false" data-tool="brush" title="Brush: paint a solid color">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l1-4L16 5l3 3L8 19z"/></svg>
        <span>Brush</span>
      </button>
      <button class="tool" type="button" role="radio" aria-checked="false" data-tool="move" title="Move: drag to pan, pinch or scroll to zoom">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v18M3 12h18M9 6l3-3 3 3M9 18l3 3 3-3M6 9l-3 3 3 3M18 9l3 3-3 3"/></svg>
        <span>Move</span>
      </button>
    </div>
  </footer>

  <input id="fileInput" type="file" accept="image/*" hidden>

  <dialog id="exportDialog" class="sheet">
    <h2>Save</h2>
    <div class="sheet-actions">
      <button id="shareBtn" class="btn primary large" type="button" hidden>Share…</button>
      <p id="shareNote" class="note" hidden>To keep a copy, choose Save Image or Save to Files.</p>
      <button id="saveBtn" class="btn large" type="button" hidden>Save as…</button>
      <button id="copyBtn" class="btn large" type="button" hidden>Copy</button>
      <button id="downloadBtn" class="btn large" type="button" hidden>Download</button>
      <p id="downloadNote" class="note" hidden>Shows up in the browser's download history.</p>
      <button id="closeExportBtn" class="btn ghost large" type="button">Cancel</button>
    </div>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- Covers the screen whenever the page loses focus or goes to the background,
       so app-switcher snapshots and tab thumbnails are less likely to show the image. -->
  <div id="shield" class="shield" aria-hidden="true"></div>
</body>
</html>
